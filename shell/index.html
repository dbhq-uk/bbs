<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>bbs.dbhq.uk - browse the live web as a bulletin board, in ANSI</title>
    <meta
      name="description"
      content="A bulletin board that fronts the live web. Pages are stripped of script and tracking, then redrawn in CP437 text mode; photographs are converted to ANSI art in your browser. Rust and WebAssembly, no server-side rendering."
    />
    <link rel="canonical" href="https://bbs.dbhq.uk/" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="bbs.dbhq.uk" />
    <meta property="og:url" content="https://bbs.dbhq.uk/" />
    <meta property="og:title" content="Browse the live web as a 1990s bulletin board" />
    <meta
      property="og:description"
      content="Web pages redrawn in CP437 text mode and photographs converted to ANSI art, entirely in your browser."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      The board draws every screen to a <canvas> from WebAssembly, so there
      is no text here for a crawler or a screen reader. The prose that used
      to sit under the board now lives at /about/, linked from the header on
      every page - the board fills the viewport instead. Putting text back
      here purely for crawlers would be cloaking.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://bbs.dbhq.uk/#website",
            "url": "https://bbs.dbhq.uk/",
            "name": "bbs.dbhq.uk",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://dbhq.uk/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://bbs.dbhq.uk/#app",
            "name": "bbs.dbhq.uk",
            "applicationCategory": "BrowserApplication",
            "operatingSystem": "Any browser with WebAssembly",
            "url": "https://bbs.dbhq.uk/",
            "description": "A bulletin board system that fronts the live web. Pages are stripped of script and tracking and redrawn in CP437 text mode; images are converted to ANSI art in the browser.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
            "featureList": [
              "Converts images and photographs to ANSI and ASCII art",
              "Renders web pages as 16-colour CP437 text",
              "Runs entirely client-side in WebAssembly",
              "Displays classic .ANS art files with SAUCE credits"
            ]
          }
        ]
      }
    </script>

    <!--
      Google Analytics 4, on by default with a notice and an opt-out, the
      same pattern as every *.dbhq.uk site. Not loaded at all for a visitor
      who opted out or a likely bot. Only fires on the live host, never on
      localhost or workers.dev. Must load before consent.js.
    -->
    <script src="/analytics.js"></script>

    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/">DBHQ//BBS</a>
      <span class="tag">the world wide web, as a bulletin board</span>
      <nav>
        <a href="/ascii-art-generator/">ASCII Art</a>
        <a href="https://modem.dbhq.uk/">modem</a>
        <a href="/about/">About</a>
      </nav>
    </header>

    <div id="board"><canvas id="screen"></canvas></div>

    <footer class="bar">
      <span class="byline">
        a <a href="https://dbhq.uk/">DBHQ</a> experiment by
        <a href="https://dbhq.uk/">Daniel Grimes</a>. MIT licensed.
      </span>
      <nav>
        <a href="https://github.com/dbhq-uk/bbs">Source on GitHub</a>
        <button class="linklike" type="button" data-analytics-settings hidden>Cookie settings</button>
      </nav>
    </footer>
    <div id="turnstile"></div>

    <aside class="analytics-notice" data-analytics-notice aria-label="Analytics notice" tabindex="-1" hidden>
      <p class="analytics-notice-title">ANALYTICS</p>
      <p class="analytics-notice-text">
        DBHQ counts visits with Google Analytics to see which pages are useful.
        No advertising, and nothing shared with advertisers.
        <a href="https://dbhq.uk/privacy/#analytics">How it works</a>
      </p>
      <p class="analytics-notice-status" data-analytics-status hidden></p>
      <div class="analytics-notice-actions">
        <button type="button" data-analytics-off>Opt out</button>
        <button type="button" data-analytics-on>OK</button>
      </div>
    </aside>

    <script src="/consent.js"></script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
