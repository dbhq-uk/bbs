name = "bbs"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

# The board is a Worker with static assets, not a Pages project.
#
# `directory` is the built shell; `binding` lets worker/index.ts hand a
# request back to the asset server when no route matches. Assets are tried
# first, so /gw, /session, /auth and /sites reach the Worker only because
# nothing in shell/dist claims those paths.
[assets]
directory = "shell/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "bbs"
database_id = "1f201cdb-eb83-4e4f-9186-a6ab335feb40"

[[kv_namespaces]]
binding = "QUOTA"
id = "700825175cd149b09ac512fc79dc6fff"

# THE RATE LIMITS, and why this project left Pages to get them.
#
# KV is read-modify-write: under a burst many requests read the same counter
# and each overwrites the others, so a per-client limit is simply bypassed.
# These bindings are atomic and are the actual security boundary;
# functions/_lib/quota.ts falls back to KV only when they are absent.
#
# A Pages project cannot hold one. `wrangler pages deploy` rejects `unsafe`
# outright, and the REST API is worse than a refusal - PATCHing the binding
# onto the project returns success and silently discards it, which is how
# this was confirmed rather than assumed.
#
# namespace_id is a per-Worker identifier, not an account resource: it only
# has to be unique here and stable across deploys, because changing it
# resets the counters. period must be 10 or 60; the runtime accepts nothing
# else. The limits mirror the constants in quota.ts - broadest first, so a
# caller cannot spend the expensive checks on the way to being refused.
[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "RL_IP"
namespace_id = "1002"
simple = { limit = 90, period = 60 }

[[ratelimits]]
name = "RL_SESSION"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_TARGET"
namespace_id = "1004"
simple = { limit = 60, period = 60 }
