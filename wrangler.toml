name = "bbs"
compatibility_date = "2026-09-01"
pages_build_output_dir = "shell/dist"

# Replace with the real id printed by `wrangler kv namespace create QUOTA`.
# A placeholder here deploys a Worker whose KV writes fail silently, so the
# session allowance never decrements and the metering banner lies.
[[d1_databases]]
binding = "DB"
database_name = "bbs"
database_id = "1f201cdb-eb83-4e4f-9186-a6ab335feb40"

[[kv_namespaces]]
binding = "QUOTA"
id = "700825175cd149b09ac512fc79dc6fff"

# NOTE: rate-limit bindings are NOT here, and cannot be.
#
# Cloudflare Pages rejects `unsafe` bindings, which is the only way to
# declare a ratelimit binding, so `wrangler pages deploy` fails outright
# with "Configuration file for Pages projects does not support unsafe".
# Workers with static assets DO support them.
#
# Until this project migrates from Pages to a Worker, functions/_lib/quota.ts
# falls back to KV counters, which are read-modify-write and therefore
# approximate under a burst. See the open issue on the repo.