[package]
name = "bbs-core"
version = "0.1.0"
edition = "2021"
description = "Semantic projection, layout and CP437 quantisation for bbs.dbhq.uk"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"

[dev-dependencies]
insta = "1"
# Decoding PNG is a TEST-ONLY need. In the browser the shell hands the core
# RGBA that the browser already decoded, so the wasm payload never carries a
# decoder and the size budget is untouched.
png = "0.17"

# wasm-pack 0.13.1 bundles a binaryen that predates the bulk-memory
# proposal, but Rust 1.98 emits `memory.fill` by default, so the stock
# `wasm-opt -O` fails with "error validating input". Enabling the features
# explicitly is the fix; setting `wasm-opt = false` would also build but
# would silently forfeit the size optimisation the payload budget assumes.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Oz', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']
