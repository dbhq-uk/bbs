name: ci

# Every push runs the suite, including on a branch with no pull request open -
# that is how work here is actually watched, and narrowing this to main took
# the signal away.
#
# The duplicate run is dropped at the job level instead. A branch in this repo
# with a pull request open fired the whole suite twice, once for the push and
# once for the pull_request, on identical code. Every job below is therefore
# guarded with `IS_NOT_A_DUPLICATE`: run on a push, and run on a pull request
# only when it comes from a fork, whose pushes this repo never sees at all.
on:
  push:
  pull_request:

# Superseded runs on the same branch are cancelled: unlike a deploy, a half
# finished test run leaves nothing behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    # IS_NOT_A_DUPLICATE - see the `on:` block. A push, or a pull request
    # from a fork.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo test --manifest-path core/Cargo.toml
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check

  # Rust-only CI would let every shell, Worker and production-build failure
  # through, which is most of the surface area of this project.
  web:
    runs-on: ubuntu-latest
    # IS_NOT_A_DUPLICATE - see the `on:` block. A push, or a pull request
    # from a fork.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The WASM package must exist before the shell can install or build.
      - run: wasm-pack build core --target web --release
      - name: Fail if the payload has ballooned
        run: |
          size=$(gzip -9 -c core/pkg/bbs_core_bg.wasm | wc -c)
          echo "wasm gzipped: $size bytes"
          test "$size" -lt 250000

      # The Worker suite - the gate, the relay, sessions and routing. The
      # comment above has always claimed CI covers these; until 9 Sep 2026 it
      # did not actually run them, so a Worker could go out red.
      - run: npm install
      - run: npm test

      - name: Build the shell and run its tests
        run: |
          cd shell
          npm install
          npm run build
          npx vitest run

      # The deploy is `wrangler deploy`, so a config or bundling error only
      # surfaces at deploy time otherwise. --dry-run does the whole build and
      # binding resolution without shipping anything.
      - run: npx wrangler deploy --dry-run

      # The deploy purges and verifies whatever this prints, so an empty or
      # truncated list would let both of those steps pass having done nothing.
      # It can only be exercised against a real build, which is why it lives
      # in this job rather than a lint one.
      - name: The deploy's URL list must be derivable and complete
        run: |
          set -euo pipefail
          python3 scripts/urls.py | tee /tmp/urls.txt
          for want in / /about/ /ascii-art-generator/ /robots.txt /sitemap.xml /llms.txt; do
            grep -qx "https://bbs.dbhq.uk${want}" /tmp/urls.txt \
              || { echo "the purge list is missing ${want}"; exit 1; }
          done

  # Repo rule, and the one most easily broken by pasting prose in from
  # anywhere else.
  style:
    runs-on: ubuntu-latest
    # IS_NOT_A_DUPLICATE - see the `on:` block. A push, or a pull request
    # from a fork.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No em dashes or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' \
               --include='*.rs' --include='*.ts' --include='*.js' \
               --include='*.md' --include='*.html' --include='*.css' \
               --include='*.py' --include='*.toml' --include='*.yml' \
               --include='*.sh' \
               --exclude-dir=node_modules --exclude-dir=target \
               --exclude-dir=dist --exclude-dir=pkg --exclude-dir=corpus \
               . ; then
            echo "em or en dash found - use a plain hyphen"
            exit 1
          fi
          echo "no em or en dashes"

      # Every one of these is on the deploy path, and a syntax error in one is
      # a deploy that dies after the Worker has already gone out.
      - name: The deploy scripts must parse
        run: |
          set -euo pipefail
          for s in scripts/*.sh; do bash -n "$s"; echo "ok $s"; done
          python3 -m py_compile scripts/urls.py
          echo "ok scripts/urls.py"

  # A public repo with dependencies should know when one of them is withdrawn
  # or has an advisory filed against it.
  audit:
    runs-on: ubuntu-latest
    # IS_NOT_A_DUPLICATE - see the `on:` block. A push, or a pull request
    # from a fork.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
