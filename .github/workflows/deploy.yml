name: deploy

# Push to main -> bbs.dbhq.uk is deployed, the edge cache purged, and the
# result verified with a cache-buster. The purge is the step that gets
# forgotten by hand, and forgetting it means the board silently serves stale
# files - robots.txt, sitemap.xml and llms.txt all did exactly that on
# 9 Sep 2026. It is not optional.
#
# The four steps are the same four scripts/deploy.sh runs, called here rather
# than restated, so the manual fallback and CI cannot drift apart. That
# mattered immediately: the hand-written purge list this replaced had already
# gone stale.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "shell/**"
      - "worker/**"
      - "functions/**"
      - "scripts/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Two deploys of the same Worker racing each other can land in either order,
# so the second one to start is not necessarily the one that ends up live.
# Queue them instead, and do not cancel - a cancelled deploy can have shipped
# the Worker and not yet purged the cache, which is the worst of both.
concurrency:
  group: deploy-bbs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags - a hijacked tag would run
      # with our Cloudflare credentials in scope.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # `stable`, matching ci.yml. A pinned version here would mean the
      # toolchain that gates a change is not the toolchain that ships it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The WASM package must exist before the shell can install or build:
      # shell/package.json depends on it as `file:../core/pkg`.
      - name: Build the core
        run: wasm-pack build core --target web --release

      - name: Build the shell
        run: |
          set -euo pipefail
          cd shell
          npm install
          npm run build

      # wrangler itself, for the deploy. Separate from the shell's install
      # because they are separate package trees.
      - name: Install the Worker toolchain
        run: npm install

      # No --dry-run guard here; ci.yml runs one on every push and pull
      # request, so a config or bundling error has already been caught by the
      # time anything reaches main.
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The token goes in via env, not interpolated into the command line, so
      # it cannot surface in a traced command or an error message.
      - name: Purge the edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: ./scripts/purge.sh

      # Every served URL, the content-hashed WASM core, the CSP that lets it
      # instantiate, and the Worker answering its own routes rather than the
      # shell answering for it. See scripts/verify.sh for why each one is
      # there.
      - name: Verify the deploy is live
        run: ./scripts/verify.sh
